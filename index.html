<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tera Kasir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: forest sidebar + white work area on desktop; bottom nav on phone. Gate is a full-screen forest lock screen. */
:root{
  --bg:#F2F6F4;--surface:#FFFFFF;--surface-2:#E9F0EC;--ink:#0C1E17;--muted:#5A6A63;--line:#DAE4DF;
  --forest:#073B2E;--forest-2:#0E5C45;--forest-ink:#E4F5EC;--forest-muted:#9CC3B1;
  --mint:#2EE59D;--mint-soft:#DCF7EA;--mint-ink:#04603E;
  --danger:#C9353B;--danger-soft:#FBE7E7;--warn:#9A6206;--warn-soft:#FBEFD6;
  --shadow:0 1px 2px rgba(7,59,46,.06),0 10px 30px rgba(7,59,46,.08);
  --font:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06110D;--surface:#0D1B16;--surface-2:#14271F;--ink:#E5EFEA;--muted:#93A69D;--line:#21362D;
  --forest:#052A20;--forest-2:#13775A;--forest-ink:#E4F5EC;--forest-muted:#8DB7A4;
  --mint:#34E5A0;--mint-soft:#0F3427;--mint-ink:#7FF0C2;
  --danger:#F0696E;--danger-soft:#3A1618;--warn:#EBB14E;--warn-soft:#33260C;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06110D;--surface:#0D1B16;--surface-2:#14271F;--ink:#E5EFEA;--muted:#93A69D;--line:#21362D;
  --forest:#052A20;--forest-2:#13775A;--forest-ink:#E4F5EC;--forest-muted:#8DB7A4;
  --mint:#34E5A0;--mint-soft:#0F3427;--mint-ink:#7FF0C2;
  --danger:#F0696E;--danger-soft:#3A1618;--warn:#EBB14E;--warn-soft:#33260C;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* ---------- Gate ---------- */
#gate{position:fixed;inset:0;background:var(--forest);color:var(--forest-ink);overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));z-index:5}
#gate .waves{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.gcard{position:relative;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:30px;letter-spacing:-.02em;color:#fff}
.brand svg{width:40px;height:40px}
.gtitle{font-size:14px;color:var(--forest-muted)}
.gpanel{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(6px)}
.gpanel h2{font-size:18px;color:#fff}
.gsteps{display:flex;gap:6px;justify-content:center}
.gsteps i{width:28px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.gsteps i.on{background:var(--mint)}
.posbtn,.userbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#fff;transition:background .15s,border-color .15s}
.posbtn:hover,.userbtn:hover{background:rgba(46,229,157,.12);border-color:rgba(46,229,157,.5)}
.posbtn b,.userbtn b{display:block;font-size:15px}
.posbtn small,.userbtn small{color:var(--forest-muted);font-size:13px}
.posbtn .tag{margin-left:auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(46,229,157,.16);color:var(--mint)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#06261D;flex:none}
.pindots{display:flex;gap:12px;justify-content:center;margin:4px 0}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4)}
.pindots i.on{background:var(--mint);border-color:var(--mint)}
.pindots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.pindots.err{animation:none}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:58px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-size:22px;font-weight:600}
.keypad button:hover{background:rgba(255,255,255,.12)}
.keypad button:active{transform:scale(.97)}
.glink{background:none;border:0;color:var(--forest-muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.gnote{font-size:12px;color:var(--forest-muted);line-height:1.6}
.gnote code{background:rgba(255,255,255,.1);padding:1px 6px;border-radius:6px;color:#fff}
.gerr{color:#FFB4B6;font-size:13px;min-height:20px}
#gate .inp{color:var(--ink)}

/* ---------- Shell ---------- */
#app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.side{background:var(--forest);color:var(--forest-ink);display:flex;flex-direction:column;gap:4px;padding:20px 14px;overflow-y:auto}
.side .brand{font-size:24px;padding:4px 8px 18px}
.side .brand svg{width:32px;height:32px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;border:0;background:none;color:var(--forest-muted);font-weight:600;text-align:left}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav.on{background:rgba(46,229,157,.14);color:var(--mint)}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.who{display:flex;align-items:center;gap:10px;padding:6px 8px}
.who .av{width:36px;height:36px;font-size:14px}
.who b{display:block;font-size:14px;color:#fff}
.who small{font-size:12px;color:var(--forest-muted)}
.sbtn{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:none;color:var(--forest-ink);font-size:13px;font-weight:600}
.sbtn:hover{background:rgba(255,255,255,.08)}
.sbtn svg{width:16px;height:16px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:20px;margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--mint-soft);color:var(--mint-ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.demo{background:var(--warn-soft);color:var(--warn)}
.view{flex:1;min-height:0;overflow-y:auto;padding:24px}
.view.fixed{overflow:hidden}
.bnav{display:none;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;padding:6px 2px;border-radius:10px}
.bnav button svg{width:22px;height:22px}
.bnav button.on{color:var(--mint-ink);background:var(--mint-soft)}
.mobile-only{display:none}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .side{display:none}
  .bnav{display:flex}
  .top{padding:12px 16px}
  .top h1{font-size:18px}
  .view{padding:16px}
  .mobile-only{display:inline-flex}
  .hide-sm{display:none!important}
}

/* ---------- Generic UI ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:15px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--forest-2);border-color:var(--forest-2);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.mint{background:var(--mint);border-color:var(--mint);color:#04291D}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn svg{width:18px;height:18px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.inp:focus{outline:none;border-color:var(--forest-2);box-shadow:0 0 0 3px var(--mint-soft)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-left:38px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--mint-soft);color:var(--mint-ink)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.n{background:var(--surface-2);color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.empty{padding:32px;text-align:center;color:var(--muted)}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;height:100%;min-height:0}
.cat-col{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cats button{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.cats button i{width:8px;height:8px;border-radius:50%}
.cats button.on{background:var(--forest-2);border-color:var(--forest-2);color:#fff}
.prods{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;overflow-y:auto;min-height:0;padding-bottom:12px;align-content:start}
.prod{position:relative;display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px;gap:8px;transition:transform .12s,border-color .12s}
.prod:hover{border-color:var(--forest-2)}
.prod:active{transform:scale(.97)}
.prod .tile{height:78px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;letter-spacing:.02em}
.prod b{font-size:14px;line-height:1.3}
.prod .pr{font-weight:800;font-size:15px}
.prod .st{font-size:12px;color:var(--muted)}
.prod .st.low{color:var(--warn);font-weight:700}
.prod .st.out{color:var(--danger);font-weight:700}
.prod .qbadge{position:absolute;top:6px;right:6px;min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:var(--mint);color:#04291D;font-weight:800;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.prod[disabled]{opacity:.5;cursor:not-allowed}
.cart{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:0;overflow:hidden}
.cart-h{display:flex;align-items:center;gap:8px;padding:16px 18px;border-bottom:1px solid var(--line)}
.cart-h h3{font-size:16px;margin-right:auto}
.cart-items{flex:1;overflow-y:auto;min-height:0;padding:6px 18px}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.ci:last-child{border-bottom:0}
.ci b{font-size:14px}
.ci .sub{font-size:13px;color:var(--muted)}
.ci .tot{font-weight:800;text-align:right}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:800;display:grid;place-items:center}
.qty button:hover{background:var(--surface-2)}
.qty span{min-width:28px;text-align:center;font-weight:800}
.cart-f{padding:14px 18px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.row.big{font-size:20px;font-weight:800}
.disc{display:flex;align-items:center;gap:8px}
.disc .inp{padding:7px 10px;width:130px;text-align:right;font-size:14px}
.paybtn{height:56px;font-size:17px;border-radius:14px}
.holds{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.holds:empty{display:none}
.pos:not(.has-items){grid-template-columns:minmax(0,1fr)}
.pos:not(.has-items) .cart,.pos:not(.has-items) .cartbar{display:none}
@keyframes cartIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@media (min-width:861px){.pos.has-items .cart{animation:cartIn .22s ease}}
@media (prefers-reduced-motion:reduce){.pos.has-items .cart{animation:none}}
.cartbar{display:none}
.sheet-x{display:none}
@media (max-width:860px){
  .view.fixed{overflow:hidden;padding-bottom:0}
  .pos{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:0}
  .prods{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));padding-bottom:16px}
  .cart{position:fixed;left:0;right:0;bottom:0;max-height:88%;border-radius:20px 20px 0 0;z-index:30;transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
  .cart.open{transform:none}
  .sheet-x{display:inline-flex}
  .cartbar{display:flex;align-items:center;gap:12px;margin:0 -16px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line)}
  .cartbar .info{flex:1;min-width:0}
  .cartbar b{display:block;font-size:17px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:29}
}
@media (prefers-reduced-motion:reduce){.cart{transition:none}}

/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;background:rgba(3,20,14,.55);display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));z-index:50;overflow-y:auto}
.mbox{width:100%;max-width:480px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:100%;overflow:hidden}
.mbox.wide{max-width:760px}
.mh{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.mh h2{font-size:18px;margin-right:auto}
.mb{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.xbtn{width:36px;height:36px;border-radius:10px;border:0;background:var(--surface-2);display:grid;place-items:center}
.xbtn svg{width:18px;height:18px}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.methods button{padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.methods button svg{width:22px;height:22px}
.methods button.on{border-color:var(--forest-2);background:var(--mint-soft);color:var(--mint-ink)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.quick button.on{border-color:var(--forest-2);background:var(--mint-soft);color:var(--mint-ink)}
.bigtotal{display:flex;flex-direction:column;align-items:center;padding:14px;border-radius:16px;background:var(--surface-2)}
.bigtotal span{font-size:13px;color:var(--muted);font-weight:600}
.bigtotal b{font-size:34px;font-weight:800;letter-spacing:-.02em}
.change{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;background:var(--mint-soft);color:var(--mint-ink);font-weight:700}
.change b{font-size:24px}
.change.short{background:var(--danger-soft);color:var(--danger)}
.qris{display:flex;gap:16px;align-items:center;padding:14px;border-radius:14px;background:var(--surface-2)}
.qris svg{width:96px;height:96px;flex:none;background:#fff;border-radius:8px;padding:6px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.split{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}}

/* ---------- Struk ---------- */
.struk-wrap{display:flex;justify-content:center;padding:6px 0}
.struk{width:300px;max-width:100%;background:#FFFFFF;color:#111;font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;padding:20px 18px 26px;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.15);position:relative}
.struk::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 4px,#fff 0) 0 0/10px 8px,linear-gradient(45deg,transparent 4px,#fff 0) 0 0/10px 8px}
.struk .c{text-align:center}
.struk .hr{border-top:1px dashed #999;margin:8px 0}
.struk .r{display:flex;justify-content:space-between;gap:8px}
.struk .b{font-weight:800}
.struk .logo{display:flex;justify-content:center;margin-bottom:4px}
.struk .logo svg{width:30px;height:30px}
.struk .void{border:2px solid #C9353B;color:#C9353B;text-align:center;font-weight:800;padding:2px;margin:6px 0;letter-spacing:.2em}
.struk .qr{display:flex;justify-content:center;margin-top:8px}
.struk .qr svg{width:64px;height:64px}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi.hero{background:var(--forest);border-color:var(--forest);color:var(--forest-ink)}
.kpi.hero .lbl,.kpi.hero .muted{color:var(--forest-muted)}
.kpi b{font-size:26px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.delta{font-size:13px;font-weight:700}
.delta.up{color:var(--mint-ink)}
.kpi.hero .delta.up{color:var(--mint)}

/* ================= Helpers ================= */
const $ = s => document.querySelector(s);

const fmtT = ms => { const d = new Date(ms); return `${pad(d.getHours())}.${pad(d.getMinutes())}`; };
const ymd = ms => { const d = new Date(ms); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`; };
const dayStart = ms => { const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); };
const DAY = 864e5;
const HARI = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];

/* ================= Data ================= */
// Source of truth is Supabase (see Cloud below). KEY only caches the business data plus this device's kasir session, cart and open bills.
const KEY = 'tera-kasir-v2';
let S;
const blank = () => ({usaha:{nama:'',footer:'',ig:''}, cabang:[], users:[], kategori:[], produk:[], trx:[], hold:[], seq:{}, shift:{}, shiftLog:[], kas:[], session:null, cart:{}});

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function seed(){
  const S0 = {
    usaha:{nama:'Teh Poci Mas Endow',footer:'Terima kasih, sampai jumpa lagi!',ig:'@tehpoci.masendow'},
    cabang:[
      {id:'01',nama:'Cabang Darmo',pos:'POS-01',alamat:'Jl. Raya Darmo 112, Surabaya'},
      {id:'02',nama:'Cabang Rungkut',pos:'POS-02',alamat:'Jl. Rungkut Madya 45, Surabaya'}
    ],
    users:[
      {id:'u1',nama:'Endow',role:'Owner',pin:'111111',warna:'#2EE59D'},
      {id:'u2',nama:'Ibik',role:'Kasir',pin:'222222',warna:'#F5C451'},
      {id:'u3',nama:'Sari',role:'Kasir',pin:'333333',warna:'#8FD3FF'}
    ],
    kategori:[
      {id:'c1',nama:'Teh Biasa',warna:'#2E9E6E'},
      {id:'c2',nama:'Teh Poci Mix',warna:'#0E6B50'},
      {id:'c3',nama:'Kopi & Latte',warna:'#8A5A3B'},
      {id:'c4',nama:'Camilan',warna:'#C27A14'}
    ],
    produk:[
      ['p1','Es Teh Jasmine','c1',3000,500,48,40],
      ['p2','Vanilla Tea','c1',5000,1000,36,30],
      ['p3','Krampul Selasih','c2',5000,1000,30,24],
      ['p4','Teh Tarik Gula Aren','c2',5000,1000,28,26],
      ['p5','Milk Tea','c2',7000,1500,32,20],
      ['p6','Chocolate','c2',7000,1500,25,18],
      ['p7','Thai Tea','c2',8000,2500,4,12],
      ['p8','Matcha','c2',10000,3000,6,3],
      ['p9','Coconut Latte','c3',10000,3000,20,15],
      ['p10','Aren Latte','c3',10000,3000,22,16],
      ['p11','Cappucino','c3',7000,1500,18,14],
      ['p12','Roti Bakar Coklat','c4',8000,3000,15,10],
      ['p13','Kentang Goreng','c4',10000,4000,12,0],
      ['p14','Pisang Goreng Keju','c4',9000,3500,10,8]
    ].map(([id,nama,kat,harga,hpp,s1,s2]) => ({id,nama,kat,jenis:'barang',harga,hpp,stok:{'01':s1,'02':s2},min:8,aktif:true})),
    trx:[], hold:[], seq:{}, shift:{}, shiftLog:[], kas:[], session:null, cart:{}
  };
  // example history: 14 days, both branches
  const rnd = mulberry32(20261019);
  const now = Date.now();
  const tmp = [];
  for (let d = 13; d >= 0; d--) {
    const base = dayStart(now - d*DAY);
    for (const cab of ['01','02']) {
      const weekend = [0,6].includes(new Date(base).getDay());
      let n = Math.floor((cab==='01'?5:3) + rnd()*(cab==='01'?6:4) + (weekend?3:0));
      for (let k = 0; k < n; k++) {
        const t = base + (8 + rnd()*13.5) * 36e5;
        if (t > now - 5*60e3) continue;
        const cnt = 1 + Math.floor(rnd()*3);
        const items = [];
        for (let j = 0; j < cnt; j++) {
          const p = S0.produk[Math.floor(rnd()*S0.produk.length)];
          const ex = items.find(i => i.pid === p.id);
          const q = 1 + (rnd() < .25 ? 1 : 0);
          if (ex) ex.qty += q; else items.push({pid:p.id,nama:p.nama,qty:q,harga:p.harga,hpp:p.hpp});
        }
        const sub = items.reduce((a,i)=>a+i.qty*i.harga,0);
        const r = rnd();
        const metode = r < .68 ? 'Tunai' : r < .9 ? 'QRIS' : 'Transfer';
        const bayar = metode==='Tunai' ? [sub, Math.ceil(sub/5000)*5000, Math.ceil(sub/10000)*10000, 50000].filter(v=>v>=sub)[Math.floor(rnd()*3)] || sub : sub;
        const kasir = cab==='01' ? (rnd()<.6?'Endow':'Ibik') : (rnd()<.7?'Sari':'Ibik');
        tmp.push({id:uid(),cab,kasir,waktu:Math.round(t),items,sub,disc:0,total:sub,metode,bayar,kembali:bayar-sub,status:'Lunas'});
      }
    }
  }
  tmp.sort((a,b)=>a.waktu-b.waktu);
  for (const t of tmp) { t.no = nextNo(S0, t.cab, t.waktu); }
  // one voided example
  const v = tmp[Math.floor(tmp.length*0.6)]; if (v) { v.status='Batal'; v.alasan='Salah input menu'; }
  S0.trx = tmp;
  return S0;
}
function nextNo(st, cab, ms){
  const k = cab + '-' + ymd(ms);
  st.seq[k] = (st.seq[k]||0) + 1;
  return `TR-${cab}-${ymd(ms)}-${String(st.seq[k]).padStart(4,'0')}`;
}

function renderGate(){
  const g = ui.gate;
  const stepIdx = {pos:0,user:1,pin:2}[g.step] ?? -1;
  const terminal = stepIdx >= 0;
  let body = '';
  if (g.step === 'pos') {
    body = `<h2>Pilih terminal</h2>
      ${S.cabang.map(c => { const sh = shiftOf(c.id); return `<button class="posbtn" data-act="g-pos" data-id="${c.id}">
        <div><b>${c.pos} · ${esc(c.nama)}</b><small>${esc(c.alamat)}</small></div>
        <span class="tag">${sh?.open ? 'Shift buka' : 'Siap'}</span></button>`; }).join('')}`;
  } else if (g.step === 'user') {
    const c = S.cabang.find(x => x.id === g.pos);
    body = `<h2>Siapa yang bertugas?</h2><div class="gnote" style="margin-top:-8px">${c.pos} · ${esc(c.nama)}</div>
      ${S.users.map(u => `<button class="userbtn" data-act="g-user" data-id="${u.id}">
        <span class="av" style="background:${u.warna}">${initials(u.nama)}</span>
        <div><b>${esc(u.nama)}</b><small>${u.role}</small></div></button>`).join('')}
      <button class="glink" data-act="g-back">Ganti terminal</button>`;
  } else if (g.step === 'pin') {
    const u = S.users.find(x => x.id === g.user);
    body = `<div style="display:flex;flex-direction:column;align-items:center;gap:8px">

async function pinHash(uid, pin){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`${Cloud.bid}:${uid}:${pin}`));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
function gateKey(k){
  const g = ui.gate; if (g.step !== 'pin' || g.pin.length >= 6) return;
  g.pin += k; renderGate();
  if (g.pin.length === 6) {
    const u = S.users.find(x => x.id === g.user);
    pinHash(u.id, g.pin).then(h => {
      if (u.pin === h) setTimeout(()=>login(g.pos, u.id), 120);
      else setTimeout(()=>{ g.pin=''; renderGate(); const d=$('#pindots'); d.classList.add('err'); $('#gerr').textContent='PIN salah. Coba lagi.'; }, 150);
    });
  }
}
document.addEventListener('keydown', e => {
  if ($('#gate').hidden || ui.gate.step !== 'pin') return;
  if (/^\d$/.test(e.key)) gateKey(e.key);
  else if (e.key === 'Backspace') { ui.gate.pin = ui.gate.pin.slice(0,-1); renderGate(); }
});

  S.session = {cab:cabId, user:userId, at:Date.now()}; save();

}

        <div style="font-size:14px"><b>${pay.metode==='QRIS'?'Minta pelanggan scan QRIS toko':'Transfer ke rekening toko'}</b><div class="muted" style="margin-top:4px">${pay.metode==='QRIS'?'QRIS statis milik toko.':'BCA 123 456 7890 a.n. Teh Poci Mas Endow.'} Pastikan dana sudah masuk sebelum menekan Selesai. Status dicatat sebagai konfirmasi manual.</div></div></div>`}

function updateChange(){

  const b = document.querySelector('[data-act="pay-done"]'); if (b) b.disabled = k < 0;
}
function fakeQR(){
  const r = mulberry32(77); let s = '';
  for (let y=0;y<21;y++) for (let x=0;x<21;x++){
    const finder = (x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
    let on;
    if (finder){ const fx=x>13?x-14:x, fy=y>13?y-14:y; on = fx===0||fx===6||fy===0||fy===6||(fx>1&&fx<5&&fy>1&&fy<5); }
    else on = r() < .48;
    if (on) s += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 21 21" fill="#0C1E17" shape-rendering="crispEdges" aria-label="Contoh QRIS">${s}</svg>`;
}
function finishPay(){
  const c = cart(), cid = sess().cab, tot = cartTotal(c);
  if (pay.metode === 'Tunai' && pay.bayar < tot) return;
  for (const i of c.items) { const p = prod(i.pid); if (p && p.jenis !== 'jasa' && (p.stok[cid]||0) < i.qty) { toast(`Stok ${i.nama} tidak cukup`); return; } }
  const now = Date.now();
  const t = {id:uid(), no:nextNo(S, cid, now), cab:cid, kasir:me().nama, waktu:now, items:c.items.map(i=>({...i})), sub:cartSub(c), disc:c.disc||0, total:tot,
    metode:pay.metode, bayar: pay.metode==='Tunai' ? pay.bayar : tot, kembali: pay.metode==='Tunai' ? pay.bayar - tot : 0, status:'Lunas', pelanggan:c.nama||''};
  for (const i of t.items) { const p = prod(i.pid); if (p && p.jenis!=='jasa') p.stok[cid] = (p.stok[cid]||0) - i.qty; }
  S.trx.push(t);
  S.cart[cid] = {items:[],disc:0,nama:''};
  save();
  renderKasir();
  showStruk(t, true);
}

function shiftCalc(cid){
  const sh = shiftOf(cid); if (!sh?.open) return null;
  const trx = S.trx.filter(t => t.cab===cid && t.waktu>=sh.mulai && t.status==='Lunas');
  const tunai = trx.filter(t=>t.metode==='Tunai').reduce((a,t)=>a+t.total,0);
  const nonTunai = trx.filter(t=>t.metode!=='Tunai').reduce((a,t)=>a+t.total,0);
  const mov = S.kas.filter(k => k.cab===cid && k.waktu>=sh.mulai);
  const sum = tp => mov.filter(k=>k.tipe===tp).reduce((a,k)=>a+k.nominal,0);
  const modal = sum('Kas masuk'), keluar = sum('Pengeluaran'), purch = sum('Purchasing'), setor = sum('Setor tunai');
  const seharusnya = sh.kasAwal + tunai + modal - keluar - purch - setor;
  return {sh, trx, tunai, nonTunai, mov, modal, keluar, purch, setor, seharusnya};
}

/* ================= Laporan ================= */
function periodRange(p){
  const t0 = dayStart(Date.now());
  if (p==='hari') return [t0, t0+DAY];
  if (p==='kemarin') return [t0-DAY, t0];
  if (p==='7') return [t0-6*DAY, t0+DAY];
  if (p==='30') return [t0-29*DAY, t0+DAY];
  return [0, t0+DAY];
}
function scopeCab(){ return !isOwner() ? sess().cab : ui.cabF==='cur' ? sess().cab : ui.cabF; }
function lapData(){
  const [a,b] = periodRange(ui.lapP), sc = scopeCab();
  let list = S.trx.filter(t => t.waktu>=a && t.waktu<b && (sc==='all' || t.cab===sc));
  if (!isOwner()) list = list.filter(t => t.kasir === me().nama);
  if (ui.lapQ) list = list.filter(t => t.no.toLowerCase().includes(ui.lapQ.toLowerCase()));
  list = list.slice().sort((x,y)=>y.waktu-x.waktu);
  const ok = list.filter(t=>t.status==='Lunas');
  const by = m => ok.filter(t=>t.metode===m).reduce((s,t)=>s+t.total,0);
  return {a, b, sc, list, ok, by};
}
function renderLap(){
  const {sc, list, ok, by} = lapData();
  $('#view').innerHTML = `<div class="toolbar">
      <div class="seg">${[['hari','Hari ini'],['kemarin','Kemarin'],['7','7 hari'],['30','30 hari']].map(([k,l])=>`<button class="${ui.lapP===k?'on':''}" data-act="lap-p" data-k="${k}">${l}</button>`).join('')}</div>

      <div class="kpi"><span class="lbl">Penjualan</span><b class="num">${rp(ok.reduce((s,t)=>s+t.total,0))}</b><span class="muted" style="font-size:13px">${ok.length} nota lunas</span></div>

/* ---- Export PDF ---- */
// jsPDF is loaded only when the first PDF is made, so the rest of the app never waits on it.
const PDF_LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'];
let pdfLibs;
function loadPdfLibs(){
  if (!pdfLibs) pdfLibs = PDF_LIBS.reduce((p,src) => p.then(() => new Promise((ok,no) => {
    const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error(src)); document.head.appendChild(s);
  })), Promise.resolve()).catch(e => { pdfLibs = null; throw e; });
  return pdfLibs;
}
const LAP_P = {hari:'Hari ini',kemarin:'Kemarin','7':'7 hari terakhir','30':'30 hari terakhir'};
const fmtD = ms => fmtDT(ms).slice(0,10);
const lapPeriode = (a,b) => { const s = fmtD(a), e = fmtD(b-1); return `${LAP_P[ui.lapP]} (${s===e ? s : s+' s/d '+e})`; };
const cabLabel = sc => { if (sc==='all') return 'Semua cabang'; const c = S.cabang.find(x=>x.id===sc); return `${c.pos} · ${c.nama}`; };
const lapCols = sc => ['No. nota','Waktu',...(sc==='all'?['Cabang']:[]),'Kasir','Item','Total','Metode','Status'];

async function exportPdf(btn){
  btn.disabled = true; btn.textContent = 'Menyiapkan PDF…';
  try { await loadPdfLibs(); }
  catch(e) { toast('Modul PDF gagal dimuat. Periksa koneksi internet.'); btn.disabled = false; btn.innerHTML = `${I.pdf}Unduh PDF`; return; }
  const d = lapData(), cols = lapCols(d.sc), now = Date.now();
  const ori = ui.pdfOri === 'auto' ? pdfAutoOri(cols) : ui.pdfOri;
  const doc = new window.jspdf.jsPDF({orientation:ori, unit:'mm', format:'a4'});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 14;
  const FOREST = [7,59,46], FOREST2 = [14,92,69], MUTED = [90,106,99];

  // Header: store name + period
  doc.setFillColor(...FOREST); doc.rect(0, 0, W, 32, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(255);
  doc.text(S.usaha.nama, M, 13);
  doc.setFontSize(11); doc.text('LAPORAN PENJUALAN', W-M, 13, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(156,195,177);
  doc.text(`Cabang: ${cabLabel(d.sc)}`, M, 20.5);
  doc.text(`Periode: ${lapPeriode(d.a,d.b)}`, M, 26);
  doc.text(`Dibuat ${fmtDT(now)} oleh ${me().nama}`, W-M, 26, {align:'right'});
  let y = 40;
  const notes = [];
  if (!isOwner()) notes.push(`Hanya transaksi milik ${me().nama}`);
  if (ui.lapQ) notes.push(`Filter nomor nota: "${ui.lapQ}"`);
  if (notes.length) { doc.setFontSize(9); doc.setTextColor(...MUTED); doc.text(notes.join(' · '), M, y); y += 6; }

  // Summary
  const omzet = d.ok.reduce((s,t)=>s+t.total,0), batal = d.list.length - d.ok.length;
  const cnt = m => d.ok.filter(t=>t.metode===m).length;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(12,30,23); doc.text('Ringkasan', M, y);
  doc.autoTable({
    startY: y + 3, margin:{left:M, right:M}, theme:'plain', tableWidth: Math.min(120, W-2*M),
    styles:{fontSize:10, cellPadding:{top:1.6,bottom:1.6,left:0,right:2}, textColor:[12,30,23]},
    columnStyles:{0:{textColor:MUTED}, 1:{halign:'right', fontStyle:'bold'}, 2:{halign:'right', textColor:MUTED}},
    body:[
      ['Omzet (nota lunas)', rp(omzet), ''],
      ['Jumlah transaksi', `${d.ok.length} lunas`, batal ? `${batal} batal` : ''],
      ...['Tunai','QRIS','Transfer'].map(m => [`Total ${m}`, rp(d.by(m)), `${cnt(m)} nota`]),
    ],
  });

  // Transaction table
  y = doc.lastAutoTable.finalY + 8;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(12,30,23); doc.text('Daftar transaksi', M, y);
  const iItem = cols.indexOf('Item'), iTotal = cols.indexOf('Total'), iStatus = cols.indexOf('Status');
  const body = d.list.length ? d.list.map(t => [t.no, fmtDT(t.waktu), ...(d.sc==='all' ? [S.cabang.find(c=>c.id===t.cab).pos] : []),
      t.kasir, t.items.reduce((s,i)=>s+i.qty,0), rp(t.total), t.metode, t.status])
    : [[{content:'Belum ada transaksi di periode ini.', colSpan:cols.length, styles:{halign:'center', textColor:MUTED}}]];
  doc.autoTable({
    startY: y + 3, margin:{left:M, right:M, top:16, bottom:16}, head:[cols], body, theme:'striped',
    styles:{fontSize:9, cellPadding:2.2, textColor:[12,30,23]},
    headStyles:{fillColor:FOREST2, textColor:255, fontStyle:'bold'},
    alternateRowStyles:{fillColor:[242,246,244]},
    columnStyles:{[iItem]:{halign:'right'}, [iTotal]:{halign:'right', fontStyle:'bold'}},
    didParseCell: c => { if (c.section==='head' && (c.column.index===iItem || c.column.index===iTotal)) c.cell.styles.halign = 'right';
      if (c.section==='body' && c.column.index===iStatus && c.cell.raw==='Batal') { c.cell.styles.textColor = [201,53,59]; c.cell.styles.fontStyle = 'bold'; } },
  });

  // Footer on every page: "Halaman X dari Y"
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    doc.setDrawColor(218,228,223); doc.line(M, H-12, W-M, H-12);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...MUTED);
    doc.text(`${S.usaha.nama} · ${lapPeriode(d.a,d.b)}`, M, H-7);
    doc.text(`Halaman ${i} dari ${n}`, W-M, H-7, {align:'right'});
  }
  doc.save(`Laporan-Tera-${ymd(now)}.pdf`);
  closeModal(); toast('Laporan PDF diunduh');
}

function renderDash(){
  const sc = scopeCab(), own = isOwner();
  const p = ui.period;
  const [a,b] = periodRange(p);
  const len = b - a;
  const inS = t => (sc==='all' || t.cab===sc) && t.status==='Lunas';
  const cur = S.trx.filter(t => inS(t) && t.waktu>=a && t.waktu<b);
  const prev = S.trx.filter(t => inS(t) && t.waktu>=a-len && t.waktu<a);
  const omzet = arr => arr.reduce((s,t)=>s+t.total,0);
  const laba = arr => arr.reduce((s,t)=>s+t.total - t.items.reduce((x,i)=>x+i.qty*i.hpp,0),0);
  const dl = (x,y) => { if (!y) return `<span class="delta muted">Belum ada pembanding</span>`; const d = Math.round((x-y)/y*100); return `<span class="delta ${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${Math.abs(d)}% vs periode lalu</span>`; };
  const O = omzet(cur), N = cur.length;
  // chart buckets
  let buckets = [];
  if (p==='hari') { for (let h=7; h<=22; h++) buckets.push({l:pad(h), a:a+h*36e5, b:a+(h+1)*36e5}); }
  else { const days = p==='7'?7:30; for (let d=0; d<days; d++){ const s=a+d*DAY; const dt=new Date(s); buckets.push({l: days===7 ? HARI[dt.getDay()] : String(dt.getDate()), a:s, b:s+DAY}); } }
  buckets.forEach(k => k.v = cur.filter(t=>t.waktu>=k.a && t.waktu<k.b).reduce((s,t)=>s+t.total,0));
  // top products
  const agg = {};
  cur.forEach(t => t.items.forEach(i => { agg[i.nama] = agg[i.nama] || {q:0,v:0}; agg[i.nama].q += i.qty; agg[i.nama].v += i.qty*i.harga; }));
  const top = Object.entries(agg).sort((x,y)=>y[1].v-x[1].v).slice(0,5);
  const topMax = top[0]?.[1].v || 1;
  const met = ['Tunai','QRIS','Transfer'].map(m => [m, cur.filter(t=>t.metode===m).reduce((s,t)=>s+t.total,0)]);
  const metCol = {Tunai:'var(--forest-2)',QRIS:'var(--mint)',Transfer:'var(--warn)'};
  const cids = sc==='all' ? S.cabang.map(c=>c.id) : [sc];
  const low = [];
  S.produk.filter(x=>x.aktif && x.jenis!=='jasa').forEach(x => cids.forEach(c => { const s = x.stok[c]||0; if (s <= x.min) low.push({x, c, s}); }));
  low.sort((u,v)=>u.s-v.s);
  $('#view').innerHTML = `<div class="toolbar">
      <div class="seg">${[['hari','Hari ini'],['7','7 hari'],['30','30 hari']].map(([k,l])=>`<button class="${p===k?'on':''}" data-act="dash-p" data-k="${k}">${l}</button>`).join('')}</div>
      ${cabSeg()}
    </div>
    <div class="kpis">
      <div class="kpi hero"><span class="lbl">Omzet</span><b class="num">${rp(O)}</b>${dl(O, omzet(prev))}</div>
      <div class="kpi"><span class="lbl">Transaksi</span><b class="num">${N}</b>${dl(N, prev.length)}</div>
      <div class="kpi"><span class="lbl">Rata-rata per nota</span><b class="num">${rp(N?O/N:0)}</b><span class="delta muted">${N?'dari '+N+' nota':'—'}</span></div>
      ${own ? `<div class="kpi"><span class="lbl">Laba kotor</span><b class="num">${rp(laba(cur))}</b>${dl(laba(cur), laba(prev))}</div>`
            : `<div class="kpi"><span class="lbl">Item terjual</span><b class="num">${cur.reduce((s,t)=>s+t.items.reduce((x,i)=>x+i.qty,0),0)}</b><span class="delta muted">porsi/unit</span></div>`}
    </div>
    <div class="dgrid" style="margin-top:16px">
      <div class="card chart"><h3>Penjualan ${p==='hari'?'per jam hari ini':p==='7'?'7 hari terakhir':'30 hari terakhir'}</h3>${barChart(buckets)}</div>
      <div class="card"><h3>Produk terlaris</h3>${top.length ? `<div class="toplist">${top.map(([n,v],i)=>`<div class="ti"><span class="n">${i+1}</span><b>${esc(n)}</b><span class="num">${rp(v.v)}</span><div class="meter"><i style="width:${(v.v/topMax*100).toFixed(1)}%"></i></div></div>`).join('')}</div>` : '<div class="muted">Belum ada penjualan.</div>'}</div>
      <div class="card"><h3>Metode pembayaran</h3><div class="grid" style="gap:12px">${met.map(([m,v])=>`<div class="mrow"><span>${m}</span><div class="meter"><i style="width:${O?(v/O*100).toFixed(1):0}%;background:${metCol[m]}"></i></div><span class="num" style="font-weight:700">${O?Math.round(v/O*100):0}%</span></div>`).join('')}</div></div>
      <div class="card"><h3>Stok perlu perhatian</h3>${low.length ? low.slice(0,6).map(l=>`<div class="lowrow"><span>${esc(l.x.nama)}${sc==='all'?` <span class="muted">· ${S.cabang.find(c=>c.id===l.c).pos}</span>`:''}</span><span class="pill ${l.s<=0?'bad':'warn'} num">${l.s<=0?'Habis':'Sisa '+l.s}</span></div>`).join('') : '<div class="muted">Semua stok aman.</div>'}</div>
    </div>`;
}
function barChart(bk){
  const W = 640, H = 220, L = 46, R = 8, T = 10, B = 26;
  const max = Math.max(...bk.map(b=>b.v), 1);
  const step = max > 400000 ? 200000 : max > 200000 ? 100000 : max > 80000 ? 50000 : max > 40000 ? 20000 : 10000;
  const top = Math.ceil(max/step)*step;
  const y = v => T + (H-T-B) * (1 - v/top);
  const bw = (W-L-R)/bk.length;
  const ticks = []; for (let v=0; v<=top; v+=step) ticks.push(v);
  const every = bk.length > 16 ? 5 : 1;
  const hiIdx = bk.reduce((m,b,i)=>b.v>bk[m].v?i:m,0);
  const fmt = v => v>=1e6 ? (v/1e6).toLocaleString('id-ID')+' jt' : v>=1000 ? Math.round(v/1000)+' rb' : String(v);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik penjualan">
    ${ticks.map(v=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`).join('')}
    ${bk.map((b,i)=>{ const x = L + i*bw + bw*0.18, w = bw*0.64, h = (H-T-B) - (y(b.v)-T); return `<rect class="bar ${i===hiIdx&&b.v>0?'hi':''}" x="${x.toFixed(1)}" y="${y(b.v).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="3"><title>${b.l}: ${rp(b.v)}</title></rect>${(i%every===0||i===bk.length-1)?`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${b.l}</text>`:''}`; }).join('')}
  </svg>`;
}

function moneyFormat(inp){
  const n = parseRp(inp.value); const pos = inp.value.length - inp.selectionStart;
  inp.value = n ? n.toLocaleString('id-ID') : '';
  try { const p = Math.max(0, inp.value.length - pos); inp.setSelectionRange(p,p); } catch(e){}
  return n;
}

  else if (k === 'lapq') { ui.lapQ = el.value; const pos = el.selectionStart; renderLap(); const n = $('#lapq'); n.focus(); n.setSelectionRange(pos,pos); }

      d.set(rows);
      if (d.n === 'produk') { this.applyStock(); this.snapStock = stockOut(); }
      this.snap.set(d.n, rowsMap(d));
    }
    persist(); softRender();
  },

  async start(){
    this.msg = '';
    if (!S) renderGate();
    try { if (!window.supabase?.createClient) await new Promise((ok,no) => { const s = document.createElement('script'); s.src = SB_LIB; s.onload = ok; s.onerror = () => { s.remove(); no(); }; document.head.appendChild(s); }); }
    catch(e) { this.offline = true; setStatus(); if (!S) this.gateMsg('Tidak ada koneksi internet. Sambungkan HP ke internet untuk masuk pertama kali.'); return; }
    if (!sb) {
      sb = window.supabase.createClient(SB_URL, SB_KEY);
      sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') setTimeout(() => this.needAuth(), 0); });
    }
    const {data, error} = await sb.auth.getSession();
    if (data?.session) return this.connect(data.session);
    if (error && errKind(error) === 'retry') { this.offline = true; setStatus(); if (!S) this.gateMsg('Tidak ada koneksi internet.'); return; }
    this.needAuth();
  },
  async connect(session){
    const bid = session.user.id;
    this.email = session.user.email || '';
    if (this.bid !== bid) { S = null; this.bid = bid; this.box = []; this.dead = []; this.loadBox(); }
    if (!S) { ui.gate = {step:'loading'}; $('#app').hidden = true; $('#gate').hidden = false; renderGate(); }
    let ok;
    try { ok = await this.pull(); }
    catch(e) {
      if (e.kind === 'schema') this.schemaErr = 'Tabel Supabase belum dibuat. Jalankan supabase/schema.sql.';
      else this.offline = true;
      setStatus();
      if (!S || !S.cabang.length) this.gateMsg(e.kind === 'schema' ? this.schemaErr : e.kind === 'retry' ? 'Tidak ada koneksi internet.' : e.message);
      else this.ready = true; // keep selling from the cached data; the outbox waits
      return;
    }
    if (!ok) { S = null; ui.gate = {step:'setup'}; $('#app').hidden = true; $('#gate').hidden = false; renderGate(); return; }
    this.ready = true;
    this.subscribe();
    this.flush();
    if (!$('#gate').hidden && !['pos','user','pin'].includes(ui.gate.step)) enterApp(); else softRender();
  },
  gateMsg(m){ this.msg = m; if (!$('#gate').hidden || !S) { ui.gate = {step:'loading'}; $('#app').hidden = true; $('#gate').hidden = false; renderGate(); } },
  needAuth(){
    this.ready = false; this.email = '';
    if (this.ch) { sb.removeChannel(this.ch); this.ch = null; }
    ui.gate = {step:'auth', email:ui.gate.email || ''}; closeModal(); $('#app').hidden = true; $('#gate').hidden = false; renderGate();
  },
  async signIn(email, password, btn){
    const err = $('#gerr'); err.style.color = ''; err.textContent = '';
    if (!sb) { err.textContent = 'Belum terhubung ke server. Periksa internet lalu muat ulang.'; return; }
    btn.disabled = true; ui.gate.email = email;
    const {data, error} = ui.gate.daftar
      ? await sb.auth.signUp({email, password, options:{emailRedirectTo:location.origin + location.pathname}})
      : await sb.auth.signInWithPassword({email, password});
    btn.disabled = false;
    if (error) { err.textContent = /invalid login/i.test(error.message) ? 'Email atau kata sandi salah.' : /not confirmed/i.test(error.message) ? 'Email belum dikonfirmasi. Buka link di email dulu.' : /already registered/i.test(error.message) ? 'Email ini sudah terdaftar. Silakan masuk.' : error.message; return; }
    if (!data.session) { ui.gate.daftar = false; renderGate(); $('#gerr').style.color = 'var(--mint)'; $('#gerr').textContent = 'Akun dibuat. Buka link konfirmasi di email, lalu masuk di sini.'; return; }
    this.connect(data.session);
  },
  async signOut(){
    if (this.box.length) { toast(`Masih ada ${this.box.length} data belum terkirim. Sambungkan internet dulu.`); return; }
    try { await sb?.auth.signOut({scope:'local'}); } catch(e){}
    try { localStorage.removeItem(KEY); localStorage.removeItem(OUTBOX); } catch(e){}
    S = null; this.bid = null; this.snap = null; this.srv = null;
    this.needAuth();
  },
  // Replace this business's data with `data` (sample or a fresh start) and upload it all.
  async seedBusiness(data, reset){
    if (reset) { const {error} = await sb.rpc('reset_business_data'); if (error) throw new Error(error.message); }
    data.usaha.contoh = data.usaha.contoh ?? true;
    data.usaha.versi = (S?.usaha?.versi || 0) + 1;
    for (const u of data.users) u.pin = await pinHash(u.id, u.pin);
    this.box = []; this.dead = [];
    S = data; this.srv = new Map();
    this.snap = new Map(DEFS.map(d => [d.n, new Map()])); this.snapStock = new Map();
    save();
    this.ready = true; this.subscribe();
    await this.flush();
    if (this.box.length) throw new Error(this.schemaErr || 'Koneksi terputus, data akan dikirim otomatis.');
    await this.pull();
  },
};

function syncChip(){
  const n = Cloud.box.length;
  const [cls, txt, tip] = Cloud.schemaErr ? ['demo', 'Database belum siap', Cloud.schemaErr]
    : Cloud.dead.length ? ['demo', `${Cloud.dead.length} data gagal terkirim`, Cloud.dead[Cloud.dead.length-1].err]
    : (Cloud.offline || !navigator.onLine) ? ['demo', n ? `Offline · ${n} menunggu` : 'Offline', 'Data disimpan di HP ini dan dikirim otomatis saat online lagi']
    : n ? ['', `Mengirim ${n} data`, 'Sedang dikirim ke server']
    : ['ok', 'Tersinkron', 'Semua data sudah tersimpan di server'];
  return `<span class="chip ${cls} ${cls === 'ok' ? 'hide-sm' : ''}" id="syncchip" title="${esc(tip)}"><span class="dot"></span>${txt}</span>`;
}
function setStatus(){ const el = $('#syncchip'); if (el) el.outerHTML = syncChip(); }
// Redraw after data arrived from another device, without stealing focus from someone typing.
let softT;
function softRender(){
  clearTimeout(softT);
  softT = setTimeout(() => {
    if (!S) return;
    if (!$('#gate').hidden) { if (['pos','user'].includes(ui.gate.step)) renderGate(); return; }
    if (!sess()) return;
    const a = document.activeElement, typing = a && a.closest?.('#view') && a.matches('input,select,textarea');
    if (ui.view === 'kasir') { if ($('#pos')) refreshCart(); setStatus(); }
    else if (!typing) renderApp();
  }, 150);
}

/* ================= Boot ================= */
function enterApp(){
  if (S.session && S.users.some(u=>u.id===S.session.user)) { $('#gate').hidden = true; $('#app').hidden = false; renderApp(); if (!shiftOf(sess().cab)?.open) openShiftModal(); }
  else { S.session = null; ui.gate = {step:'pos',pos:null,user:null,pin:''}; $('#app').hidden = true; $('#gate').hidden = false; renderGate(); }
}
{
  const c = load();
  if (c) { S = c.S; Cloud.bid = c.bid; Cloud.loadBox(); Cloud.resnap(); enterApp(); }
  else { ui.gate = {step:'loading'}; renderGate(); }
  Cloud.start();
  addEventListener('online', () => { Cloud.offline = false; setStatus(); if (Cloud.ready) Cloud.refresh(); else Cloud.start(); });
  addEventListener('offline', setStatus);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Cloud.ready && Date.now() - Cloud.lastPull > 15e3) Cloud.refresh(); });
  setInterval(() => Cloud.flush(), 20e3);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
